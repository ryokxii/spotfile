<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Spotfile</title>
    <script>
      // Pick the theme before first paint so light-mode users never see a dark
      // flash; stores/theme.ts takes over once the app mounts.
      document.documentElement.dataset.theme =
        matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'nocturne'
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
