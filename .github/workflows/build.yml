name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ─── macOS (universal binary: arm64 + amd64) ────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (macOS universal)
        run: wails build -platform darwin/universal -clean
        env:
          CGO_ENABLED: "1"

      - name: Package .app into zip
        run: |
          cd build/bin
          zip -r spotfile-macos.zip spotfile.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotfile-macos
          path: build/bin/spotfile-macos.zip
          retention-days: 14

  # ─── Windows (amd64) ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (Windows amd64)
        run: wails build -platform windows/amd64 -clean
        env:
          CGO_ENABLED: "1"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotfile-windows
          path: build/bin/spotfile.exe
          retention-days: 14

  # ─── Release (tag pushes only) ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: spotfile-macos
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: spotfile-windows
          path: dist/

      - name: Rename Windows binary with version
        run: mv dist/spotfile.exe dist/spotfile-windows-amd64.exe

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum spotfile-macos.zip spotfile-windows-amd64.exe > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            dist/spotfile-macos.zip
            dist/spotfile-windows-amd64.exe
            dist/SHA256SUMS.txt
