name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Latest patch of Go 1.26: current security fixes for builds and the vuln scan.
  # Not "stable": Wails v2.12's binding generator fails on Go 1.27
  # ("package ... without types"). Raise together with Wails.
  GO_VERSION: "1.26"
  NODE_VERSION: "20"
  WAILS_VERSION: v2.12.0
  GOVULNCHECK_VERSION: v1.8.0
  LLAMA_CPP_BUILD: b10964
  EMBED_MODEL_URL: https://huggingface.co/unsloth/bge-small-en-v1.5-GGUF/resolve/main/bge-small-en-v1.5-f16.gguf
  EMBED_MODEL_SHA256: c5d2302edc429f679642433b9f96dd217799727a06e675abef3b40a79f5e1589

jobs:
  # ─── Lint & static analysis ─────────────────────────────────────────────────
  lint:
    name: Lint & static analysis
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Svelte type check
        working-directory: frontend
        run: npm run check

      # main.go embeds frontend/dist, which is not committed.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (macOS)
        run: go vet ./...

      - name: go vet (Windows)
        run: GOOS=windows go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # ─── Unit + integration tests, including the memory budget ──────────────────
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            llama-asset: macos-arm64.tar.gz
            race: -race
          - name: Linux
            os: ubuntu-latest
            llama-asset: ubuntu-x64.tar.gz
            race: -race
          - name: Windows
            os: windows-latest
            llama-asset: win-cpu-x64.zip
            race: ""
    defaults:
      run:
        shell: bash
    env:
      # Real-model tests must run in CI; a missing llama.cpp or model fails instead of skipping.
      SPOTFILE_REQUIRE_LLAMA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - uses: ./.github/actions/setup-llama
        with:
          llama-build: ${{ env.LLAMA_CPP_BUILD }}
          llama-asset: ${{ matrix.llama-asset }}
          model-url: ${{ env.EMBED_MODEL_URL }}
          model-sha256: ${{ env.EMBED_MODEL_SHA256 }}

      # The engine packages hold all tests and need no webview toolchain.
      - name: go test
        run: |
          go test ${{ matrix.race }} -count=1 -timeout 20m -covermode=atomic \
            -coverprofile=coverage.out -v ./engine/... 2>&1 | tee test.log

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Test results — ${{ matrix.name }}"
            echo
            echo '```'
            grep -E '^(ok|FAIL|---)\s' test.log | grep -v -- '--- PASS' || true
            echo '```'
            if grep -q 'peak RSS' test.log; then
              echo
              echo "**Memory:** $(grep -o 'peak RSS.*' test.log | head -1)"
            fi
            if [ -f coverage.out ]; then
              echo
              echo "**Coverage:** $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}') of engine statements"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.name }}
          path: |
            test.log
            coverage.out
          retention-days: 14

  # ─── Benchmarks (informational) ─────────────────────────────────────────────
  benchmark:
    name: Benchmarks (macOS)
    runs-on: macos-latest
    env:
      SPOTFILE_REQUIRE_LLAMA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - uses: ./.github/actions/setup-llama
        with:
          llama-build: ${{ env.LLAMA_CPP_BUILD }}
          llama-asset: macos-arm64.tar.gz
          model-url: ${{ env.EMBED_MODEL_URL }}
          model-sha256: ${{ env.EMBED_MODEL_SHA256 }}

      - name: Run benchmarks
        run: |
          go test -run '^$' -bench . -benchmem -benchtime 3x -count 1 ./engine/... | tee bench.txt

      - name: Benchmark summary
        run: |
          {
            echo "### Benchmarks (GitHub-hosted runner — compare trends, not absolute numbers)"
            echo
            echo '```'
            grep -E '^(Benchmark|goos|goarch|cpu|pkg)' bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt
          retention-days: 30

  # ─── Build (runs only when lint and tests pass) ─────────────────────────────
  build-macos:
    name: Build macOS
    needs: [lint, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (macOS universal)
        run: wails build -platform darwin/universal -clean
        env:
          CGO_ENABLED: "1"

      - name: Package .app into zip
        run: |
          cd build/bin
          zip -r spotfile-macos.zip spotfile.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotfile-macos
          path: build/bin/spotfile-macos.zip
          retention-days: 14

  build-windows:
    name: Build Windows
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (Windows amd64)
        run: wails build -platform windows/amd64 -clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotfile-windows
          path: build/bin/spotfile.exe
          retention-days: 14

  # ─── Release (tag pushes only) ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: spotfile-macos
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: spotfile-windows
          path: dist/

      - name: Rename Windows binary with version
        run: mv dist/spotfile.exe dist/spotfile-windows-amd64.exe

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum spotfile-macos.zip spotfile-windows-amd64.exe > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            dist/spotfile-macos.zip
            dist/spotfile-windows-amd64.exe
            dist/SHA256SUMS.txt
